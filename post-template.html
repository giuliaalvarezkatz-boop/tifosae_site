<!--
  POST TEMPLATE — duplicate this file for every new piece.

  Steps:
  1. Copy this file, rename it something like post-piecename.html
  2. Change the <title> tag
  3. Change POST_GENRE, POST_TITLE, POST_AUTHOR below
  4. Change data-sport="POST_SPORT" to the right sport label (or
     remove the attribute entirely to leave the icon squares empty)
  5. Replace the placeholder <p> paragraphs with the real piece
     (one <p> per paragraph)
-->
<!DOCTYPE html>
<html lang="en" class="v2-page">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POST_TITLE — Tifosæ</title>
<link rel="stylesheet" href="https://use.typekit.net/shb1ltt.css">
<link rel="stylesheet" href="style.css">
<script src="assets/js/pieces.js"></script>
</head>
<body class="v2-page">

<header class="masthead">
  <div class="masthead-logo-row">
    <h1 class="masthead-logo"><a href="index.html">TIFOSÆ</a></h1>
  </div>
  <span class="masthead-tagline">a literary magazine about sport</span>
  <nav class="masthead-nav">
    <a href="index.html">Home</a>
    <a href="#">Search</a>
    <a href="archive.html">Submit</a>
    <a href="#" onclick="goToRandomPiece(); return false;">Random</a>
  </nav>
</header>

<div class="masthead-border"></div>

<div class="single-post-wrap">

  <div class="window-box" data-sport="POST_SPORT">
    <div class="window-titlebar">
      <div class="window-lines-edge"></div>
      <div class="window-icon-box"></div>
      <div class="window-lines"></div>
      <h2 class="window-title">POST_TITLE//POST_AUTHOR</h2>
      <div class="window-lines"></div>
      <div class="window-icon-box window-icon-box-right"></div>
      <div class="window-lines-edge"></div>
    </div>
    <div class="window-body">
      <p>
        First paragraph of the piece goes here.
      </p>
      <p>
        Second paragraph goes here. Add as many &lt;p&gt; tags as the
        piece needs.
      </p>
    </div>
  </div>

</div>

</body>
</html>
