<!DOCTYPE html>
<html lang="en" class="v2-page">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tifosæ — a literary magazine</title>
<link rel="stylesheet" href="https://use.typekit.net/shb1ltt.css">
<link rel="stylesheet" href="style.css">
<script src="assets/js/pieces.js"></script>
</head>
<body class="v2-page">

<header class="masthead">
  <div class="masthead-logo-row">
    <h1 class="masthead-logo"><a href="index.html">TIFOSÆ</a></h1>
  </div>
  <span class="masthead-tagline">a literary magazine about sport</span>
  <nav class="masthead-nav">
    <a href="index.html" target="_blank" rel="noopener">Home</a>
    <a href="#" target="_blank" rel="noopener">Search</a>
    <a href="archive.html" target="_blank" rel="noopener">Submit</a>
    <a href="#" target="_blank" rel="noopener" onclick="goToRandomPiece(); return false;">Random</a>
  </nav>
</header>

<div class="masthead-border"></div>

<div class="desktop-scatter">

  <div class="deco-window deco-square" style="width: 300px; top: 40px; left: 3%;">
    <div class="window-titlebar">
      <div class="window-lines-edge"></div>
      <div class="window-icon-box"></div>
      <div class="window-lines"></div>
    </div>
    <div class="deco-media">
      <video src="assets/videos/01.mp4" muted loop playsinline preload="metadata"></video>
    </div>
  </div>

  <div class="deco-window deco-4x3" style="width: 280px; top: 70px; right: 3%;">
    <div class="window-titlebar">
      <div class="window-lines-edge"></div>
      <div class="window-icon-box"></div>
      <div class="window-lines"></div>
    </div>
    <div class="deco-media">
      <video src="assets/videos/02.mp4" muted loop playsinline preload="metadata"></video>
    </div>
  </div>

  <div class="deco-window deco-16x9" style="width: 300px; top: 340px; left: 8%;">
    <div class="window-titlebar">
      <div class="window-lines-edge"></div>
      <div class="window-icon-box"></div>
      <div class="window-lines"></div>
    </div>
    <div class="deco-media">
      <video src="assets/videos/03.mp4" muted loop playsinline preload="metadata"></video>
    </div>
  </div>

  <div class="deco-window deco-square" style="width: 260px; top: 400px; right: 8%;">
    <div class="window-titlebar">
      <div class="window-lines-edge"></div>
      <div class="window-icon-box"></div>
      <div class="window-lines"></div>
    </div>
    <div class="deco-media">
      <video src="assets/videos/04.mp4" muted loop playsinline preload="metadata"></video>
    </div>
  </div>

  <div class="deco-window deco-portrait" style="width: 280px; top: 560px; left: 4%;">
    <div class="window-titlebar">
      <div class="window-lines-edge"></div>
      <div class="window-icon-box"></div>
      <div class="window-lines"></div>
    </div>
    <div class="deco-media">
      <video src="assets/videos/05.mp4" muted loop playsinline preload="metadata"></video>
    </div>
  </div>

  <div class="deco-window deco-4x3" style="width: 300px; top: 725px; right: 4%;">
    <div class="window-titlebar">
      <div class="window-lines-edge"></div>
      <div class="window-icon-box"></div>
      <div class="window-lines"></div>
    </div>
    <div class="deco-media">
      <video src="assets/videos/06.mp4" muted loop playsinline preload="metadata"></video>
    </div>
  </div>

<main class="home-feed">

  <div class="window-box welcome-box" data-sport="football">
    <div class="window-titlebar">
      <div class="window-lines-edge"></div>
      <div class="window-icon-box"></div>
      <div class="window-lines"></div>
      <h2 class="window-title">Welcome!</h2>
      <div class="window-lines"></div>
      <div class="window-icon-box window-icon-box-right" style="background-image: url('assets/icons/basketball-icon.png');"></div>
      <div class="window-lines-edge"></div>
    </div>
    <div class="window-body welcome-body">
      <p>
        soon this page will be full of words about sports.
      </p>
      <p>
        if you would like to be a part of that you can
        <a href="archive.html">click here to submit</a>.
      </p>
    </div>
  </div>

</main>

</div>

<script>
  document.querySelectorAll('.deco-window').forEach(function (box) {
    var video = box.querySelector('video');
    if (!video) return;

    box.addEventListener('mouseenter', function () {
      video.play().catch(function () {});
    });

    box.addEventListener('mouseleave', function () {
      video.pause();
    });
  });
</script>

</body>
</html>
